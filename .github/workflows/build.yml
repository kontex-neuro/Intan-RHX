name: Build Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'xdaq-v*'


jobs:
  build:
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        os_arch:
          [
            { os: windows-2022, arch: x64 },
            { os: macos-15, arch: arm64 },
            { os: macos-15, arch: x64 }
          ]

    runs-on: ${{ matrix.os_arch.os }}

    env:
      OS_ARCH: ${{ matrix.os_arch.os }}-${{ matrix.os_arch.arch }}

    steps:
      - name: Install build system (ubuntu)
        if: matrix.os_arch.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y pipx
          pipx install conan ninja

      - name: Install build system (windows-2022, macos-15)
        if: matrix.os_arch.os == 'windows-2022' || matrix.os_arch.os == 'macos-15'
        run: pip install conan ninja

      - name: conan cache
        id: conan_cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ env.OS_ARCH }}-conan

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Compiler (Windows)
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os_arch.os == 'windows-2022'

      - name: Setup Compiler (MacOS)
        if: matrix.os_arch.os == 'macos-15'
        run: |
          echo "CC=$(brew --prefix llvm@18)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@18)/bin/clang++" >> $GITHUB_ENV
          sed -i '' '/^#define _LIBCPP_HAS_NO_VENDOR_AVAILABILITY_ANNOTATIONS/d' "$(brew --prefix llvm@18)"/include/c++/v1/__config_site

      - name: Install OpenCL (Ubuntu)
        if: matrix.os_arch.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y ocl-icd-opencl-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: 'qtmultimedia'
          cache: true

      - name: Conan setup
        run: |
          conan config install .github/conan_profiles/${{ env.OS_ARCH }} -tf profiles

      - name: Install libxdaq
        run: |
          git clone https://github.com/kontex-neuro/kontex-conan.git kontex-conan
          conan remote add --force kontex-neuro ./kontex-conan

      - name: Build XDAQ-RHX
        run: |
          conan install . --build=missing --profile:all ${{ env.OS_ARCH }} -s build_type=Release
          cmake -S . -B build/Release --preset conan-release
          cmake --build build/Release --preset conan-release

      - name: Authenticate to Google Cloud (Windows)
        if: matrix.os_arch.os == 'windows-2022'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up KMS signing (Windows)
        if: matrix.os_arch.os == 'windows-2022'
        shell: pwsh
        env:
          EV_CERT_BASE64: ${{ secrets.EV_CERT_BASE64 }}
          KMS_KEY_PATH: ${{ secrets.KMS_KEY_PATH }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:EV_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:KMS_KEY_PATH)) {
            throw 'EV_CERT_BASE64 and KMS_KEY_PATH must be configured for Windows signing.'
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'ev_cert.crt'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:EV_CERT_BASE64))

          $zipPath = Join-Path $env:RUNNER_TEMP 'kmscng.zip'
          $extractDir = Join-Path $env:RUNNER_TEMP 'kmscng'
          Invoke-WebRequest -Uri 'https://github.com/GoogleCloudPlatform/kms-integrations/releases/download/cng-v1.4/kmscng-1.4-windows-amd64.zip' -OutFile $zipPath
          $expectedSha256 = '3c3570e4c7ff6e5ce21874b9cd595227e9e8bbe8183023f8121124c0e80738a3'
          if ((Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedSha256) {
            throw 'KMS CNG provider archive SHA256 mismatch.'
          }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $msi = Get-ChildItem -Path $extractDir -Filter '*.msi' -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'KMS CNG provider MSI not found.' }
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "KMS CNG provider installation failed: $($process.ExitCode)"
          }

      - name: Sign and verify application (Windows)
        if: matrix.os_arch.os == 'windows-2022'
        shell: pwsh
        env:
          KMS_KEY_PATH: ${{ secrets.KMS_KEY_PATH }}
        run: |
          $executables = @(Get-ChildItem -Path build/Release -Filter 'XDAQ-RHX.exe' -File -Recurse)
          if ($executables.Count -ne 1) { throw "Expected one application executable, found $($executables.Count)." }
          & ./.github/scripts/sign-windows.ps1 -Path $executables[0].FullName

      - name: Package XDAQ-RHX (Windows)
        if: matrix.os_arch.os == 'windows-2022'
        run: cmake --build build/Release --target package

      - name: Sign and verify installer (Windows)
        if: matrix.os_arch.os == 'windows-2022'
        shell: pwsh
        env:
          KMS_KEY_PATH: ${{ secrets.KMS_KEY_PATH }}
        run: |
          & ./.github/scripts/sign-windows.ps1 -Path 'build/Release/package/XDAQ-RHX-*.exe'

      - name: Package and Notarize the app (MacOS)
        if: matrix.os_arch.os == 'macos-15'
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PWD: ${{ secrets.CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PWD: ${{ secrets.APP_PWD }}
        run: |
          # Certificate setup
          echo $CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p $KEYCHAIN_PWD build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p $KEYCHAIN_PWD build.keychain
          security import certificate.p12 -k build.keychain -P $CERTIFICATE_PWD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $KEYCHAIN_PWD build.keychain

          # Codesign script called before package
          cmake --build build/Release --target package

          # Notarize
          xcrun notarytool store-credentials "kontex" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PWD"
          find build/Release/package \
            -name 'XDAQ-RHX-*-Darwin.dmg' \
            -exec xcrun notarytool submit {} --keychain-profile "kontex" --wait \; \
            -exec xcrun stapler staple {} \;

      - name: Tar binaries to keep file permissions
        shell: bash
        run: |
          tar -cvf build/package.tar -C build/Release/package $(ls build/Release/package | grep XDAQ-RHX)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS_ARCH }}
          path: build/package.tar
